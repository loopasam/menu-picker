<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff8ec" />
    <title>Menu Picker</title>
    <link rel="stylesheet" href="styles.css?v=20260830-2" />
  </head>
  <body>
    <main class="app-shell">
      <section class="week-section" aria-labelledby="week-title">
        <div class="section-heading">
          <div>
            <p class="step-number" aria-hidden="true">1</p>
            <h2 id="week-title">Your week</h2>
          </div>
          <div class="header-actions">
            <button class="print-button" id="print-week" type="button">
              <span aria-hidden="true">🖨️</span>
              Print
            </button>
            <button class="reset-button" id="reset-week" type="button">New week</button>
          </div>
        </div>

        <div class="week-board" id="week-board">
          <article class="day-card day-card--monday" data-day="monday">
            <header><span aria-hidden="true">🌤️</span><h3>Monday</h3></header>
            <div class="day-list" aria-label="Monday menu"></div>
          </article>
          <article class="day-card day-card--tuesday" data-day="tuesday">
            <header><span aria-hidden="true">🪁</span><h3>Tuesday</h3></header>
            <div class="day-list" aria-label="Tuesday menu"></div>
          </article>
          <article class="day-card day-card--wednesday" data-day="wednesday">
            <header><span aria-hidden="true">🌈</span><h3>Wednesday</h3></header>
            <div class="day-list" aria-label="Wednesday menu"></div>
          </article>
          <article class="day-card day-card--thursday" data-day="thursday">
            <header><span aria-hidden="true">🦋</span><h3>Thursday</h3></header>
            <div class="day-list" aria-label="Thursday menu"></div>
          </article>
          <article class="day-card day-card--friday" data-day="friday">
            <header><span aria-hidden="true">⭐</span><h3>Friday</h3></header>
            <div class="day-list" aria-label="Friday menu"></div>
          </article>
        </div>
      </section>

      <section class="food-section" aria-labelledby="food-title">
        <div class="section-heading">
          <div>
            <p class="step-number" aria-hidden="true">2</p>
            <h2 id="food-title">Food shelf</h2>
          </div>
          <p id="selection-message" aria-live="polite">Choose from every food group.</p>
        </div>

        <div class="food-shelf" id="food-shelf" aria-label="Foods to choose from"></div>
      </section>
    </main>

    <template id="food-card-template">
      <button class="food-card food-card--palette" type="button">
        <span class="food-card__emoji" aria-hidden="true"></span>
        <span class="food-card__label"></span>
      </button>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="app.js?v=20260830-2"></script>
  </body>
</html>
